<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>상식 퀴즈 게임</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ① 시작 화면 -->
  <div id="screen-start" class="screen">
    <div class="card">
      <h1 class="game-title">🧠 상식 퀴즈</h1>
      <p class="game-subtitle">4지선다 · 40문제 · 카테고리별 도전</p>

      <div class="form-group">
        <label for="player-name">닉네임</label>
        <input type="text" id="player-name" placeholder="이름을 입력하세요" maxlength="10" autocomplete="off">
      </div>

      <div class="form-group">
        <label for="category">카테고리</label>
        <select id="category">
          <option value="all">전체</option>
          <option value="한국사">한국사</option>
          <option value="과학">과학</option>
          <option value="지리">지리</option>
          <option value="일반상식">일반상식</option>
        </select>
      </div>

      <div class="form-group">
        <label for="difficulty">난이도</label>
        <select id="difficulty">
          <option value="all">전체</option>
          <option value="쉬움">쉬움</option>
          <option value="보통">보통</option>
          <option value="어려움">어려움</option>
        </select>
      </div>

      <p id="question-count-preview" class="question-count-preview"></p>

      <button id="btn-start" class="btn btn-primary" disabled>게임 시작</button>
      <button id="btn-go-ranking" class="btn btn-outline">순위 보기</button>
    </div>
  </div>

  <!-- ② 문제 화면 -->
  <div id="screen-quiz" class="screen hidden">
    <div class="card">
      <div class="quiz-header">
        <div class="quiz-header-left">
          <span id="category-label" class="category-badge"></span>
          <span id="difficulty-label" class="difficulty-badge"></span>
        </div>
        <span id="score-display" class="score-display">0점</span>
      </div>

      <div class="progress-wrap">
        <div class="progress-bar-track">
          <div id="progress-bar" class="progress-bar"></div>
        </div>
        <span id="progress-text" class="progress-text">1 / 10</span>
      </div>

      <p id="question-text" class="question-text"></p>

      <div id="options-grid" class="options-grid">
        <button class="option-btn" data-idx="0"></button>
        <button class="option-btn" data-idx="1"></button>
        <button class="option-btn" data-idx="2"></button>
        <button class="option-btn" data-idx="3"></button>
      </div>

      <div id="feedback-box" class="feedback-box hidden">
        <p id="feedback-msg" class="feedback-msg"></p>
        <button id="btn-next" class="btn btn-primary">다음 문제 →</button>
      </div>
    </div>
  </div>

  <!-- ③ 결과 화면 -->
  <div id="screen-result" class="screen hidden">
    <div class="card">
      <h2 class="result-title">게임 종료!</h2>
      <div id="result-grade" class="result-grade"></div>
      <p id="result-score" class="result-score"></p>
      <p id="result-correct" class="result-correct"></p>

      <div id="category-stats" class="category-stats"></div>

      <div class="result-buttons">
        <button id="btn-ranking" class="btn btn-outline">순위 보기</button>
        <button id="btn-restart" class="btn btn-primary">다시 하기</button>
      </div>
    </div>
  </div>

  <!-- ④ 순위 화면 -->
  <div id="screen-ranking" class="screen hidden">
    <div class="card">
      <h2 class="ranking-title">🏆 명예의 전당</h2>
      <ol id="ranking-list" class="ranking-list"></ol>
      <p id="ranking-empty" class="ranking-empty hidden">아직 기록이 없습니다.</p>
      <button id="btn-home" class="btn btn-outline">홈으로</button>
    </div>
  </div>

  <script src="data/questions.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
